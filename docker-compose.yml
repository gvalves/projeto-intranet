services:
  api:
    image: registry-server.igen.local/intranet-api:latest
    build:
      context: ./api
    environment:
      INTRANET_API_SHEETS_DIR: /app/data
      INTRANET_API_CORS_ORIGINS: ${INTRANET_API_CORS_ORIGINS:-'http://localhost,http://web'}
    volumes:
      - ${INTRANET_API_SHEETS_DIR:-./api/data}:/app/data
    restart: unless-stopped

  web:
    image: registry-server.igen.local/intranet-web:latest
    build:
      context: ./web
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      - api
    restart: unless-stopped
