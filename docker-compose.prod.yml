services:
  api:
    image: registry-server.igen.local/intranet-api:${VERSION:-latest}
    environment:
      INTRANET_API_SHEETS_DIR: /app/data
      INTRANET_API_CORS_ORIGINS: ${INTRANET_API_CORS_ORIGINS:-http://intranet,http://intranet.igen.local,https://intranet,https://intranet.igen.local}
    volumes:
      - ${INTRANET_API_SHEETS_DIR:-./api/data}:/app/data
    restart: unless-stopped

  web:
    image: registry-server.igen.local/intranet-web:${VERSION:-latest}
    volumes:
      - ${INTRANET_NOTICIAS_DIR:-./web/images/noticias}:/srv/noticias
      - ${INTRANET_TRABALHOS_DIR:-./web/trabalhos}:/srv/trabalhos
    depends_on:
      - api
    networks:
      default:
      nginx-net:
        aliases:
          - intranet-web
    restart: unless-stopped

networks:
  nginx-net:
    external: true
